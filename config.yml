name: sym-project-manager
version: 2.0.0
description: Project management workflows for AI coding agents
files:
  - path: files/PLANNING.md
    dest: .claude/docs/setup/PLANNING.md
  - path: files/AGENT_WORKFLOW.md
    dest: .claude/docs/setup/AGENT_WORKFLOW.md
instructions:
  - targets:
      claude: CLAUDE.md
      cursor: .cursorrules
      copilot: .github/copilot-instructions.md
      default: AGENTS.md
    content: |
      ## Planning and Execution

      When planning or starting a new project, ask: "Would you like me to use the project manager workflow for structured planning and parallel execution?" If yes, read `.claude/docs/setup/PLANNING.md` and follow it exactly.
